name: Interactive lesson KWIC release acceptance
on:
  pull_request:
    paths:
      - 'projects/interactive-lesson/**'
      - '.github/workflows/interactive-lesson-kwic.yml'
  push:
    branches: [main]
    paths:
      - 'projects/interactive-lesson/**'
      - '.github/workflows/interactive-lesson-kwic.yml'
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise browser lesson and reflection workflow
        run: node projects/interactive-lesson/kwic-browser.test.cjs
      - name: Preserve mobile render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kwic-mobile-render
          path: ${{ runner.temp }}/kwic-mobile.png
          if-no-files-found: ignore

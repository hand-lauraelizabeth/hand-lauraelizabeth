name: FT-01 crypto fallback browser review
on:
  push:
    branches:
      - 'review/ft01-crypto-fallback-browser-*'
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-crypto-fallback-review.yml'
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-crypto-fallback-review.yml'
permissions:
  contents: read
jobs:
  browser-crypto-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          cd projects/data-rescue-studio
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Validate syntax
        run: node --check projects/data-rescue-studio/tests/crypto-fallback-browser.test.cjs
      - name: Verify local source provenance and absent digest across Chromium Firefox WebKit
        run: node projects/data-rescue-studio/tests/crypto-fallback-browser.test.cjs

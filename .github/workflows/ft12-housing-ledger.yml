name: FT-12 housing ledger tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node free-tools/housing-ledger/housing-core.test.mjs
      - run: node free-tools/housing-ledger/housing-ui-contract.test.mjs

name: FT-12 housing ledger tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node free-tools/housing-ledger/housing-core.test.mjs
      - run: node free-tools/housing-ledger/housing-import.test.mjs
      - run: node free-tools/housing-ledger/housing-ui-contract.test.mjs
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node free-tools/housing-ledger/housing-reflow.browser.test.mjs ${{ matrix.browser }}
      - run: node free-tools/housing-ledger/housing-import.browser.test.mjs ${{ matrix.browser }}

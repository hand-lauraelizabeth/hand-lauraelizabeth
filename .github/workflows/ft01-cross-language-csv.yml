name: FT-01 independent CSV TSV interoperability

on:
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-cross-language-csv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-language-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CSV and TSV across independent implementations
        run: node projects/data-rescue-studio/tests/cross-language-csv.test.cjs

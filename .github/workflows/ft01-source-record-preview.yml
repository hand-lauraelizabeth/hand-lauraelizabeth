name: FT-01 source-record preview integrity
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-record-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-record preview, summary and deduplication
        run: node projects/data-rescue-studio/tests/preview-source-provenance.test.cjs

name: FT-05 bulk evidence QA
on:
  push:
    branches:
      - 'review/ft05-bulk-ci-*'
      - 'review/ft05-http-csp-ci-*'
      - 'review/ft05-http-csp-hardening-*'
      - 'review/ft05-isolated-ci-*'
      - 'review/ft05-failclosed-csv-*'
      - 'review/ft05-inline-status-reclassification-*'
      - 'review/ft05-undo-status-*'
      - 'review/ft05-source-id-find-*'
      - 'review/ft05-edit-related-groups-*'
      - 'review/ft05-group-filter-*'
      - 'review/ft05-bounded-group-summary-*'
      - 'review/ft05-guarded-exports-*'
  pull_request:
    paths:
      - 'free-tools/evidence-timeline/**'
      - '.github/workflows/ft05-bulk-qa.yml'
permissions:
  contents: read
jobs:
  bulk-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bulk test syntax
        run: node --check free-tools/evidence-timeline/bulk-boundary.test.mjs
      - name: Run 10k-record boundary and integrity checks
        run: node free-tools/evidence-timeline/bulk-boundary.test.mjs
      - name: Check conservative CSV gate syntax
        run: |
          node --check free-tools/evidence-timeline/safe-export.mjs
          node --check free-tools/evidence-timeline/safe-export.test.mjs
      - name: Run independent CSV injection and provenance regression
        run: node free-tools/evidence-timeline/safe-export.test.mjs
      - name: Verify immutable exact-ID review reclassification
        run: |
          node --check free-tools/evidence-timeline/reclassify.mjs
          node --check free-tools/evidence-timeline/reclassify.test.mjs
          node free-tools/evidence-timeline/reclassify.test.mjs
      - name: Verify reversible status changes and exact evidence
        run: |
          node --check free-tools/evidence-timeline/undo-status.mjs
          node --check free-tools/evidence-timeline/undo-status.test.mjs
          node free-tools/evidence-timeline/undo-status.test.mjs
      - name: Verify exact literal source-ID search and 10k boundary
        run: |
          node --check free-tools/evidence-timeline/source-id-find.mjs
          node --check free-tools/evidence-timeline/source-id-find.test.mjs
          node free-tools/evidence-timeline/source-id-find.test.mjs
      - name: Verify literal group search, ungrouped review and exact evidence
        run: |
          node --check free-tools/evidence-timeline/group-find.mjs
          node --check free-tools/evidence-timeline/group-find.test.mjs
          node free-tools/evidence-timeline/group-find.test.mjs
      - name: Verify bounded group preview, hidden counts and literal identifiers
        run: |
          node --check free-tools/evidence-timeline/group-summary.mjs
          node --check free-tools/evidence-timeline/group-summary.test.mjs
          node free-tools/evidence-timeline/group-summary.test.mjs
      - name: Verify guarded local CSV and JSON download lifecycle
        run: |
          node --check free-tools/evidence-timeline/download-guard.mjs
          node --check free-tools/evidence-timeline/download-guard.test.mjs
          node free-tools/evidence-timeline/download-guard.test.mjs
      - name: Verify user-assigned group editing and immutable source evidence
        run: |
          node --check free-tools/evidence-timeline/edit-group.mjs
          node --check free-tools/evidence-timeline/edit-group.test.mjs
          node free-tools/evidence-timeline/edit-group.test.mjs
      - name: Verify JSON import declared and actual byte counts
        run: |
          node --check free-tools/evidence-timeline/json-import.mjs
          node --check free-tools/evidence-timeline/json-import-byte-integrity.test.mjs
          node free-tools/evidence-timeline/json-import-byte-integrity.test.mjs
  browser-usability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright
        run: python -m pip install playwright==1.57.0
      - name: Build the WordPress release bundle
        run: |
          python free-tools/evidence-timeline/package-wordpress.py
          node --check free-tools/evidence-timeline/bundle.js
      - name: Verify the current entry, search, edit, save and reopen workflow in three browsers
        run: python free-tools/evidence-timeline/browser-usability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-timeline-usability
          path: free-tools/evidence-timeline/usability-*.png


name: FT-05 bulk evidence QA
on:
  push:
    branches:
      - 'review/ft05-bulk-ci-*'
      - 'review/ft05-http-csp-ci-*'
      - 'review/ft05-http-csp-hardening-*'
      - 'review/ft05-isolated-ci-*'
      - 'review/ft05-failclosed-csv-*'
  pull_request:
    paths:
      - 'free-tools/evidence-timeline/**'
      - '.github/workflows/ft05-bulk-qa.yml'
permissions:
  contents: read
jobs:
  bulk-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bulk test syntax
        run: node --check free-tools/evidence-timeline/bulk-boundary.test.mjs
      - name: Run 10k-record boundary and integrity checks
        run: node free-tools/evidence-timeline/bulk-boundary.test.mjs
      - name: Check conservative CSV gate syntax
        run: |
          node --check free-tools/evidence-timeline/safe-export.mjs
          node --check free-tools/evidence-timeline/safe-export.test.mjs
      - name: Run independent CSV injection and provenance regression
        run: node free-tools/evidence-timeline/safe-export.test.mjs
      - name: Verify JSON import declared and actual byte counts
        run: |
          node --check free-tools/evidence-timeline/json-import.mjs
          node --check free-tools/evidence-timeline/json-import-byte-integrity.test.mjs
          node free-tools/evidence-timeline/json-import-byte-integrity.test.mjs
  bulk-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Official version-matched Python image contains browser binaries and OS
    # dependencies; avoid repeated downloads on short-lived runners.
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
    # GitHub overrides HOME to /github/home, which Firefox rejects when root.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install version-matched Python Playwright package
        run: python -m pip install playwright==1.57.0
      - name: Check browser test syntax
        run: python -m py_compile free-tools/evidence-timeline/browser-10k-basic.py
      - name: Run HTTP module and CSP regression
        run: python free-tools/evidence-timeline/browser-http-csp-smoke.py
      - name: Run cross-browser HTTP/CSP and browser zoom checks
        run: python free-tools/evidence-timeline/browser-cross-engine.py
      - name: Run synthetic 10k-record Chromium regression
        run: |
          CHROMIUM_BIN="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python free-tools/evidence-timeline/browser-10k-basic.py

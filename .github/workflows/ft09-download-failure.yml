name: FT-09 download failure recovery
on:
  push:
    branches:
      - 'review/ft09-download-failure-20261031-0930'
      - 'review/ft09-dom-download-20261101-1130'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed JSON and CSV downloads
        run: node --test free-tools/public-records/download-failure.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify HTTP-served download failures and recovery
        env:
          FT09_BROWSER: ${{ matrix.browser }}
        run: python free-tools/public-records/download-failure.test.py

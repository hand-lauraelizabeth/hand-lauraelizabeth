name: FT-01 exact quoted newline evidence review
on:
  push:
    branches:
      - 'review/ft01-exact-quoted-newlines-*'
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-exact-quoted-newlines-review.yml'
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-exact-quoted-newlines-review.yml'
permissions:
  contents: read
jobs:
  exact-quoted-newlines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          cd projects/data-rescue-studio
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Check implementation and regression syntax
        run: |
          node --check projects/data-rescue-studio/rescue-core.js
          node --check projects/data-rescue-studio/tests/exact-quoted-newlines.test.cjs
          node --check projects/data-rescue-studio/tests/exact-quoted-newlines-browser.test.cjs
      - name: Check exact decoded newlines and export round-trip
        run: node projects/data-rescue-studio/tests/exact-quoted-newlines.test.cjs
      - name: Check synthetic browser upload and downloads in three engines
        run: node projects/data-rescue-studio/tests/exact-quoted-newlines-browser.test.cjs

name: Live national program search smoke
on:
  push:
    branches:
      - feature/matcher-program-search-ui-20261012
    paths:
      - '.github/workflows/college-program-live-smoke.yml'
      - 'projects/college-career-matching/tests/test_national_program_search_live.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify real live site and pinned assets
        run: python projects/college-career-matching/tests/test_national_program_search_live.py

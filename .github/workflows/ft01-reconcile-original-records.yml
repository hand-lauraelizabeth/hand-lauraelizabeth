name: FT-01/03 original source-record provenance
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-record-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify noncontiguous source IDs and malformed provenance
        run: node projects/data-rescue-studio/tests/reconcile-source-record-provenance.test.cjs

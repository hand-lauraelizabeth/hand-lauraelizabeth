name: Grant Ledger checks
on:
  push:
    branches: ['review/ft06-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node free-tools/grant-ledger/fullwidth-csv-regression.test.mjs

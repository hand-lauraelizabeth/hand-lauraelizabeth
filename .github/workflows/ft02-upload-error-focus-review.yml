name: FT-02 accessible upload error focus review
on:
  push:
    branches:
      - 'review/ft02-upload-error-focus-*'
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft02-upload-error-focus-review.yml'
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft02-upload-error-focus-review.yml'
permissions:
  contents: read
jobs:
  upload-error-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          cd projects/data-rescue-studio
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Check regression syntax
        run: node --check projects/data-rescue-studio/tests/upload-error-focus-browser.test.cjs
      - name: Verify keyboard, error focus, invalid state, recovery and local-only behavior in three browsers
        run: node projects/data-rescue-studio/tests/upload-error-focus-browser.test.cjs

name: College Search Sprint 1 device QA runbook contract
on:
  push:
    branches:
      - feature/college-search-sprint1-20261009
    paths:
      - 'projects/college-career-matching/SPRINT1_DEVICE_QA_AND_ROLLBACK.md'
      - 'projects/college-career-matching/tests/test_sprint1_device_qa_runbook.py'
      - '.github/workflows/college-search-sprint1-runbook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-release-documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manual device coverage and rollback safety
        run: python -m unittest discover -s projects/college-career-matching/tests -p 'test_sprint1_device_qa_runbook.py' -v

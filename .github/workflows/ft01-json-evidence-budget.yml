name: FT-01 bounded JSON evidence and privacy index
on:
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-json-evidence-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  json-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and test syntax
        run: |
          node --check projects/data-rescue-studio/rescue-core.js
          node --check projects/data-rescue-studio/tests/json-budget-issue-index.test.cjs
      - name: Verify exact UTF-8 boundaries and value-free privacy
        run: node projects/data-rescue-studio/tests/json-budget-issue-index.test.cjs
  json-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          cd projects/data-rescue-studio
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Check browser test syntax
        run: node --check projects/data-rescue-studio/tests/json-budget-browser.test.cjs
      - name: Verify served Chromium Firefox WebKit JSON errors and recovery
        run: node projects/data-rescue-studio/tests/json-budget-browser.test.cjs

name: FT-09 import evidence integrity
on:
  push:
    branches:
      - review/ft09-import-evidence-reflow-20261023-0330
      - review/ft09-crossengine-active-ci-20261023-0528
  pull_request:
    paths:
      - 'free-tools/public-records/**'
      - '.github/workflows/ft09-import-evidence.yml'
permissions:
  contents: read
jobs:
  node-import-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check free-tools/public-records/import.mjs
          node --check free-tools/public-records/app.mjs
          node --check free-tools/public-records/strict-json.mjs
      - name: Test duplicate keys and actual file sizes with synthetic records
        run: |
          node --test free-tools/public-records/json-duplicate-key.test.mjs free-tools/public-records/file-size-integrity.test.mjs
  http-crossengine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify HTTP-served synthetic import and local-only CSP
        env:
          FT09_BROWSER: ${{ matrix.browser }}
        run: |
          python free-tools/public-records/http-import-crossengine.test.py
          python free-tools/public-records/import-race.test.py

name: FT-10 stale-report browser QA
on:
  push:
    branches:
      - 'review/ft10-main-stale-report-*'
      - 'review/ft10-served-csp-export-*'
      - 'review/ft10-csv-invisible-failclosed-*'
      - 'review/ft10-file-byte-integrity-*'
      - 'review/ft10-html-content-guard-*'
  pull_request:
    paths:
      - 'free-tools/accessibility-preflight/**'
      - '.github/workflows/ft10-stale-report-browser.yml'
  workflow_dispatch:

jobs:
  synthetic-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runner
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run source-invalidation regression
        env:
          FT10_BROWSER: ${{ matrix.browser }}
        run: python free-tools/accessibility-preflight/stale_report.browser.test.py
      - name: Run served HTTP/CSP and local-export regression
        env:
          FT10_BROWSER: ${{ matrix.browser }}
        run: python free-tools/accessibility-preflight/served_csp.browser.test.py

  csv-security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact-source CSV security regression
        run: node free-tools/accessibility-preflight/report-export.test.mjs
      - name: Run File API byte-integrity and async-race regression
        run: node --test free-tools/accessibility-preflight/file-input.integrity.test.mjs

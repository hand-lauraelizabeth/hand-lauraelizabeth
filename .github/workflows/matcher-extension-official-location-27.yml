name: Matcher extension source-context QA
on:
  push:
    branches:
      - 'review/matcher-extension-official-location-27-*'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test projects/college-career-matching/tests/test_extension_official_location_27_20261015.cjs

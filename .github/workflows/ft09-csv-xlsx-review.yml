name: FT-09 CSV interoperability review
on:
  pull_request:
    paths:
      - 'free-tools/public-records/**'
      - '.github/workflows/ft09-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv-xlsx-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install workbook test dependency
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Run independent CSV and XLSX roundtrip regressions
        run: python free-tools/public-records/csv-interoperability.test.py

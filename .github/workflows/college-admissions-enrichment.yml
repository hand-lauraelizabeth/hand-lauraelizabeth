name: College Search admissions-score validation

on:
  push:
    branches:
      - feature/college-admissions-score-bands-20261011
    paths:
      - .github/workflows/college-admissions-enrichment.yml
      - projects/college-career-matching/college-search-sprint3-embed.js
      - projects/college-career-matching/college-search-sprint3.html
      - projects/college-career-matching/tests/test_admissions_scores.cjs
      - projects/college-career-matching/tests/test_admissions_scores_browser.py
      - projects/college-career-matching/tests/test_admissions_scores_live.py
      - projects/college-career-matching/data/sprint3/college-search-scores.v1.json
      - projects/college-career-matching/data/sprint3/college-search-scores.v2.json
      - projects/college-career-matching/data/sprint3/college-search-scores.v3.json
      - projects/college-career-matching/build_scorecard_history_overlay.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SAT ACT ranges, evidence gate and DOM contracts
        run: node --test projects/college-career-matching/tests/test_admissions_scores.cjs

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run static matcher mobile/desktop browser scenarios
        run: |
          cd projects/college-career-matching
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/score-site.log 2>&1 &
          sleep 2
          python tests/test_admissions_scores_browser.py
          python tests/test_sprint3_city_cost_browser.py
          python tests/test_sprint3_net_sort_browser.py
          python tests/test_admissions_scores_live.py

  enrich:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify pinned Scorecard archive and build real score percentile bands
        run: python projects/college-career-matching/build_sprint4_admissions.py
      - name: Validate generated percentile data
        run: node --test projects/college-career-matching/tests/test_admissions_scores.cjs
      - name: Commit only generated score overlay to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/college-career-matching/data/sprint3/college-search-scores.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "data(college): verified 2026 SAT and ACT percentile overlay"
            git push origin HEAD:feature/college-admissions-score-bands-20261011
          fi

name: College Search admissions-score validation

on:
  push:
    branches:
      - feature/college-admissions-score-bands-20261011
    paths:
      - .github/workflows/college-admissions-enrichment.yml
      - projects/college-career-matching/build_sprint4_admissions.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate SAT and ACT range filters and category rules
        run: node --test projects/college-career-matching/tests/test_admissions_scores.cjs
      - name: Verify pinned source archive, build real score percentile bands
        run: python projects/college-career-matching/build_sprint4_admissions.py
      - name: Confirm enriched fixture is safe
        run: node --test projects/college-career-matching/tests/test_admissions_scores.cjs
      - name: Commit only generated score overlay to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/college-career-matching/data/sprint3/college-search-scores.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "data(college): verified 2026 SAT and ACT percentile overlay"
            git push origin HEAD:feature/college-admissions-score-bands-20261011
          fi

name: FT-01 original-byte evidence browser review
on:
  push:
    branches:
      - 'review/ft01-browser-digest-download-*'
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-browser-digest-review.yml'
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-browser-digest-review.yml'
permissions:
  contents: read
jobs:
  browser-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          cd projects/data-rescue-studio
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Check browser test syntax
        run: node --check projects/data-rescue-studio/tests/evidence-digest-browser.test.cjs
      - name: Test real downloads in Chromium Firefox WebKit
        run: node projects/data-rescue-studio/tests/evidence-digest-browser.test.cjs

name: FT-01 dynamic axe accessibility audit
on:
  push:
    branches:
      - 'review/ft01-axe-dynamic-accessibility-*'
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-axe-dynamic-accessibility.yml'
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-axe-dynamic-accessibility.yml'
permissions:
  contents: read
jobs:
  axe-dynamic-states:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local accessibility and browser runners
        run: |
          cd projects/data-rescue-studio
          npm install --no-save --no-package-lock playwright@1.57.0 axe-core@4.10.3
      - name: Validate synthetic test syntax
        run: node --check projects/data-rescue-studio/tests/axe-dynamic-accessibility-browser.test.cjs
      - name: Audit empty, invalid, loaded, filtered, focused and narrow-screen states in three browsers
        run: node projects/data-rescue-studio/tests/axe-dynamic-accessibility-browser.test.cjs

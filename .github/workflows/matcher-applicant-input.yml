name: Applicant input validation
on:
  push:
    branches:
      - feature/matcher-publication-containment-20261009
    paths:
      - 'projects/college-career-matching/applicant_input_contract.py'
      - 'projects/college-career-matching/tests/test_applicant_input_contract.py'
      - 'projects/college-career-matching/tests/test_applicant_score_boundary.py'
      - '.github/workflows/matcher-applicant-input.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate GPA SAT ACT testing policies and enrollment
        run: python -m unittest discover -s projects/college-career-matching/tests -p 'test_applicant*.py' -v

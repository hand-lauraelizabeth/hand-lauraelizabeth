name: Reverse ATS integration browser regression
on:
  push:
    branches:
      - test/matcher-reverse-ats-integration-20261008
    paths:
      - 'projects/reverse-ats-role-evidence-engine/**'
      - '.github/workflows/reverse-ats-integration-browser.yml'
  pull_request:
    paths:
      - 'projects/reverse-ats-role-evidence-engine/**'
      - '.github/workflows/reverse-ats-integration-browser.yml'
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install 'selenium>=4.20,<5'
      - name: Run synthetic shared-profile and application-status browser regression
        run: python projects/reverse-ats-role-evidence-engine/tests/browser_scenarios.py

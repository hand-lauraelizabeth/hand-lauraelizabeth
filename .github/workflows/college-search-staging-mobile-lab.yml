name: College Search Sprint 1 mobile Lighthouse (private staging proxy)
on:
  push:
    branches:
      - feature/college-search-sprint1-20261009
    paths:
      - '.github/workflows/college-search-staging-mobile-lab.yml'
      - 'projects/college-career-matching/tests/serve_sprint1_mobile_lab.py'
      - 'projects/college-career-matching/college-search-sprint1.html'
      - 'projects/college-career-matching/data/sprint1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-lighthouse-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pinned WordPress staging dataset URL and CORS
        run: |
          python - <<'PY'
          import json, urllib.request
          url = ("https://cdn.jsdelivr.net/gh/hand-lauraelizabeth/"
                 "hand-lauraelizabeth@557c1350efd82001564745a1ef0922295b99625d/"
                 "projects/college-career-matching/data/sprint1/college-search-national.v1.json")
          request = urllib.request.Request(url, headers={"Origin":"https://www.lauraelizabethhand.com"})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()
              cors = response.headers.get("Access-Control-Allow-Origin","")
              payload = json.loads(raw)
              assert response.status == 200
              assert cors in ("*","https://www.lauraelizabethhand.com"), f"Missing CORS: {cors!r}"
              assert payload["source_release"] == "2026-06-10"
              assert len(payload["institutions"]) == 6243
              print(json.dumps({"source_status": response.status,
                                "cors": cors, "institutions": len(payload["institutions"]),
                                "source_bytes":len(raw),"source_url":url}))
          PY
      - name: Start compressed local static lab fixture
        run: |
          python -u projects/college-career-matching/tests/serve_sprint1_mobile_lab.py >/tmp/college-search-lab.log 2>&1 &
          for _ in $(seq 1 20); do if curl -fsS http://127.0.0.1:8775/college-search-sprint1.html >/dev/null; then break; fi; sleep .5; done
          curl -fsSI http://127.0.0.1:8775/college-search-sprint1.html | head -n 10
          curl -fsS -D /tmp/dataset-headers.txt -o /tmp/dataset-body.gz http://127.0.0.1:8775/data/sprint1/college-search-national.v1.json
          grep -i '^Content-Encoding: gzip' /tmp/dataset-headers.txt
          test "$(wc -c </tmp/dataset-body.gz)" -eq 179675
      - name: Install pinned Lighthouse
        run: npm install --no-save --no-package-lock --ignore-scripts lighthouse@12.8.2
      - name: Run three mobile Lighthouse performance audits
        run: |
          command -v google-chrome || command -v chromium
          for n in 1 2 3; do
            ./node_modules/.bin/lighthouse \
              http://127.0.0.1:8775/college-search-sprint1.html \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance --form-factor=mobile \
              --throttling-method=simulate --output=json \
              --output-path="/tmp/college-search-lighthouse-$n.json" --quiet
          done
          python - <<'PY'
          import json,statistics
          from pathlib import Path
          metrics=[]
          for i in (1,2,3):
              p=Path(f"/tmp/college-search-lighthouse-{i}.json")
              report=json.loads(p.read_text())
              audits=report["audits"]
              m={"run":i,"lcp_ms":round(audits["largest-contentful-paint"]["numericValue"],1),
                 "performance_score":round(report["categories"]["performance"]["score"]*100),
                 "tbt_ms":round(audits["total-blocking-time"]["numericValue"],1),
                 "cls":round(audits["cumulative-layout-shift"]["numericValue"],3)}
              metrics.append(m)
          median=round(statistics.median(x["lcp_ms"] for x in metrics),1)
          result={"method":"Mobile Lighthouse; Chrome; simulated mobile throttling; local static proxy for WordPress DRAFT, not WP staging host",
                  "runs":metrics,"median_lcp_ms":median,"lcp_budget_ms":3000,
                  "lcp_budget_met":median<3000}
          Path("college-search-mobile-lighthouse-summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("MOBILE_LIGHTHOUSE_SUMMARY "+json.dumps(result,sort_keys=True))
          assert median < 3000, f"Mobile LCP budget failed: median {median} ms (max 3000 ms)"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: college-search-sprint1-mobile-lighthouse-proxy
          path: |
            /tmp/college-search-lighthouse-*.json
            college-search-mobile-lighthouse-summary.json
          if-no-files-found: warn

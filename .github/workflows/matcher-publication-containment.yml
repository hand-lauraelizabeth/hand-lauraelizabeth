name: Matcher publication containment
on:
  push:
    branches:
      - feature/matcher-publication-containment-20261009
  pull_request:
    paths:
      - 'projects/college-career-matching/public-explorer.html'
      - 'projects/college-career-matching/publication_exposure_audit.py'
      - 'projects/college-career-matching/tests/test_publication_exposure_audit.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run publication exposure regressions
        run: python -m unittest discover -s projects/college-career-matching/tests -p test_publication_exposure_audit.py -v
      - name: Audit public explorer source
        run: python projects/college-career-matching/publication_exposure_audit.py projects/college-career-matching/public-explorer.html

name: FT-10 image button naming regression
on:
  push:
    branches:
      - 'review/ft10-image-button-names-*'
  pull_request:
    paths:
      - 'free-tools/accessibility-preflight/control-checks.mjs'
      - 'free-tools/accessibility-preflight/control-checks.test.mjs'
      - 'free-tools/accessibility-preflight/image-button-names.browser.test.py'
      - '.github/workflows/ft10-image-button-names.yml'
  workflow_dispatch:

jobs:
  synthetic-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify image/button naming checks
        run: node free-tools/accessibility-preflight/control-checks.test.mjs
      - name: Check module syntax
        run: node --check free-tools/accessibility-preflight/control-checks.mjs

  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise browser-local preflight and JSON export
        env:
          FT10_BROWSER: ${{ matrix.browser }}
        run: python free-tools/accessibility-preflight/image-button-names.browser.test.py

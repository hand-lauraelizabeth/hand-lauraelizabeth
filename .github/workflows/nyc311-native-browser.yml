name: NYC 311 native Chromium preview regression

on:
  push:
    branches:
      - 'review/nyc311-*'
    paths:
      - 'projects/nyc311-operations-intelligence/**'
      - '.github/workflows/nyc311-native-browser.yml'
  pull_request:
    paths:
      - 'projects/nyc311-operations-intelligence/**'
      - '.github/workflows/nyc311-native-browser.yml'

permissions:
  contents: read

jobs:
  native-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test driver
        run: python -m pip install 'selenium==4.36.0'
      - name: Check native Chrome availability
        run: |
          google-chrome --version
          chromedriver --version
      - name: Test exact checked-out synthetic HTML in native Chromium
        run: python -m unittest discover -s projects/nyc311-operations-intelligence -p 'test_native_browser_preview.py' -v

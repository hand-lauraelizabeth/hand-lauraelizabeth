name: College matcher validation

on:
  push:
    paths:
      - 'projects/college-career-matching/ui/**'
      - 'projects/college-career-matching/ny_pilot_*.py'
      - 'projects/college-career-matching/tests/test_ny_pilot_*.py'
      - '.github/workflows/college-matcher-validation.yml'
  pull_request:
    paths:
      - 'projects/college-career-matching/ui/**'
      - 'projects/college-career-matching/ny_pilot_*.py'
      - 'projects/college-career-matching/tests/test_ny_pilot_*.py'
      - '.github/workflows/college-matcher-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate public data if present
        shell: bash
        run: |
          DATA='projects/college-career-matching/ui/public-data.json'
          if [ -f "$DATA" ]; then
            python projects/college-career-matching/ui/validate-public-data.py "$DATA"
          else
            echo 'No reviewed public-data.json published; synthetic prototype only.'
          fi
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run matcher validator and importer regression suite
        run: python -m unittest discover -s projects/college-career-matching/ui -p 'test_*.py' -v
      - name: Run NY pilot provenance and admissions regression tests
        env:
          PYTHONPATH: projects/college-career-matching
        run: python -m unittest discover -s projects/college-career-matching/tests -p 'test_ny_pilot_*.py' -v
      - name: Run matcher browser smoke tests
        run: python projects/college-career-matching/ui/test_browser.py

name: FT-01 preview and summary source-record provenance
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  preview-source-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original record IDs in preview, summary and deduplication
        run: node projects/data-rescue-studio/tests/preview-source-provenance.test.cjs

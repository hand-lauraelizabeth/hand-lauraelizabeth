name: Sprint 3 official HD2025 source recovery and 49-case comparison
on:
  push:
    branches:
      - feature/college-search-sprint1-20261009
    paths:
      - 'projects/college-career-matching/recover_sprint3_07.py'
      - '.github/workflows/college-search-sprint3-source-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-hd2025:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax and pre-existing 6243 row Scorecard snapshot
        run: |
          python -m py_compile projects/college-career-matching/recover_sprint3_07.py
          python projects/college-career-matching/build_sprint2_national.py --check
      - name: Fetch official HD2025 and compare all 49 unresolved institutions
        run: python projects/college-career-matching/recover_sprint3_07.py
      - name: Assert authentic official source and no accidental public geo assignment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("projects/college-career-matching")
          j=json.loads((p/"research_aggregate/s3_07_hd2025_source_recovery.json").read_text())
          q=json.loads((p/"research_work/s3_07_49_case_comparison.json").read_text())["cases"]
          assert j["official_hd2025_retrieved"],"Source missing; do not mark recovery DONE"
          assert j["hd2025_metadata"]["url"]=="https://nces.ed.gov/ipeds/complete-data-files/HD2025.zip"
          assert j["hd2025_metadata"]["record_count"]>5000
          assert len(j["hd2025_metadata"]["zip_sha256"])==64
          assert len(j["hd2025_metadata"]["csv_sha256"])==64
          assert sum(j["cross_year_unitid_membership"].values())==49==len(q)
          assert all(x["year_group"] is not None for x in q)
          assert len({x["unitid"] for x in q})==49
          assert j["new_location_approvals"]==0
          assert j["existing_city_label_match_baseline"]==5659
          assert j["original_unresolved_for_location_release"]==584
          assert j["prior_research_only_census_place_identifiers"]==3
          assert not j["public_deployment_authorized"]
          assert all(not x["location_approved_for_public_release"] and x["reviewed_census_geoid"] is None for x in q)
          registry=json.loads((p/"research_aggregate/s3_05_approved_city_place_registry.json").read_text())
          assert registry["accepted_records"]==3 and not registry["deployment_approved"]
          print("S3_07_OFFICIAL_HD2025_VERIFIED",j["hd2025_metadata"]["record_count"],j["cross_year_unitid_membership"])
          PY
      - name: Archive private working comparison as repo-permission artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprint3-07-hd2025-unitid-reconciliation-49
          path: projects/college-career-matching/research_work/s3_07_49_case_comparison.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit source hashes and aggregate report, never raw college coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/college-career-matching/research_aggregate/s3_07_hd2025_source_recovery.json projects/college-career-matching/S3_07_IPEDS_RECOVERY.md
          if git diff --cached --quiet; then
            echo "S3-07 findings already current"
          else
            git commit -m "Record official HD2025 source hashes and 49-school historical identity comparison"
            git push origin HEAD:feature/college-search-sprint1-20261009
          fi

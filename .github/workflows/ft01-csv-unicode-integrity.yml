name: FT-01 CSV Unicode integrity
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  csv-unicode-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject silent Unicode replacement with synthetic fixtures
        run: node projects/data-rescue-studio/tests/unpaired-surrogate-export.test.cjs

name: FT-09 browser layout and keyboard review
on:
  pull_request:
    paths:
      - 'free-tools/public-records/**'
      - '.github/workflows/ft09-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-reflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run FT-09 responsive layout and keyboard tests
        run: python free-tools/public-records/browser-reflow-review.test.py

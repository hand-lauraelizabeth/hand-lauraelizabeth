name: Matcher cross-state extension identity QA
on:
  push:
    branches:
      - 'review/matcher-cross-state-extension-triage-*'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test projects/college-career-matching/tests/test_cross_state_extension_triage_20261015.cjs

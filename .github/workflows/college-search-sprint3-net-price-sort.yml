name: College Search average-net-price sort static release gate
on:
  push:
    branches:
      - feature/college-search-sprint1-20261009
    paths:
      - 'projects/college-career-matching/college-search-sprint3-embed.js'
      - 'projects/college-career-matching/college-search-sprint3.html'
      - 'projects/college-career-matching/tests/test_sprint3_net_sort.cjs'
      - 'projects/college-career-matching/tests/test_sprint3_net_sort_browser.py'
      - '.github/workflows/college-search-sprint3-net-price-sort.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-price-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable 6243-school data and JS syntax
        run: |
          python projects/college-career-matching/build_sprint3_cost_city.py --check
          node --check projects/college-career-matching/college-search-sprint3-embed.js
      - name: Verify complete 6243-row price ordering and missing-value behavior
        run: node projects/college-career-matching/tests/test_sprint3_net_sort.cjs
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Read-only static UI tests at mobile and desktop widths
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory projects/college-career-matching >/tmp/s3-net-sort-server.log 2>&1 &
          python projects/college-career-matching/tests/test_sprint3_net_sort_browser.py

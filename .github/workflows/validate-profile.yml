name: Validate portfolio resources

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "resources/**/*.xlsx"
      - "resources/**/*.docx"
      - "scripts/check_local_markdown_links.py"
      - "scripts/validate_office_resources.py"
      - "scripts/check_name_consistency.py"
      - "scripts/validate_college_career_sources.py"
      - "scripts/college_career_ingest.py"
      - "scripts/test_college_career_ingestion.py"
      - "projects/college-career-matching/**"
      - "projects/text-lens/**"
      - ".github/workflows/validate-profile.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "resources/**/*.xlsx"
      - "resources/**/*.docx"
      - "scripts/check_local_markdown_links.py"
      - "scripts/validate_office_resources.py"
      - "scripts/check_name_consistency.py"
      - "scripts/validate_college_career_sources.py"
      - "scripts/college_career_ingest.py"
      - "scripts/test_college_career_ingestion.py"
      - "projects/college-career-matching/**"
      - "projects/text-lens/**"
      - ".github/workflows/validate-profile.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install College Career test dependencies
        run: python -m pip install --disable-pip-version-check pandas selenium
      - name: Validate local Markdown links
        run: python scripts/check_local_markdown_links.py
      - name: Validate Office resource packages
        run: python scripts/validate_office_resources.py
      - name: Enforce full public name
        run: python scripts/check_name_consistency.py
      - name: Validate college career source contract
        run: python scripts/validate_college_career_sources.py
      - name: Test college career ingestion prototype
        run: python scripts/test_college_career_ingestion.py
      - name: Run College Career synthetic regression suite
        run: python projects/college-career-matching/tests/run_synthetic_regression_suite.py
      - name: Run synthetic staging HTTP smoke test
        run: python projects/college-career-matching/staging_http_smoke.py
      - name: Run synthetic staging browser interaction scenarios
        run: python projects/college-career-matching/staging_browser_scenarios.py
      - name: Run matcher staging browser edge-state scenarios
        run: python projects/college-career-matching/staging_browser_edge_scenarios.py
      - name: Run matcher latency and recovery browser scenarios
        run: python projects/college-career-matching/staging_browser_concurrency_scenarios.py
      - name: Run Text Lens browser contract tests
        run: python projects/text-lens/tests/test_text_lens_contract.py
      - name: Run Text Lens browser interaction scenarios
        run: python projects/text-lens/tests/text_lens_browser_scenarios.py
      - name: Live CIP-SOC ingestion smoke test
        if: contains(github.event.head_commit.message, '[live-source-smoke]')
        run: python scripts/college_career_ingest.py --source cip_soc_crosswalk_2020_2018 --output-dir "${{ runner.temp }}/college-career-smoke"
      - name: Live IPEDS ingestion smoke test
        if: contains(github.event.head_commit.message, '[live-ipeds-smoke]')
        run: |
          python scripts/college_career_ingest.py --source ipeds_directory_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source ipeds_completions_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
      - name: Live program coverage
        if: contains(github.event.head_commit.message, '[live-program-smoke]')
        run: |
          python scripts/college_career_ingest.py --source ipeds_directory_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source ipeds_completions_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source cip_soc_crosswalk_2020_2018 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --build-program-coverage --enforce-coverage-baseline --output-dir "${{ runner.temp }}/college-career-smoke"
      - name: Live O*NET ingestion smoke test
        if: contains(github.event.head_commit.message, '[live-onet-smoke]')
        run: python scripts/college_career_ingest.py --source onet_31_0 --output-dir "${{ runner.temp }}/college-career-smoke"
      - name: Live BLS ingestion and O*NET coverage joins
        if: contains(github.event.head_commit.message, '[live-bls-smoke]')
        run: |
          python scripts/college_career_ingest.py --source onet_31_0 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source bls_employment_projections_2025_2035 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source bls_oews_may_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --build-career-joins --enforce-coverage-baseline --output-dir "${{ runner.temp }}/college-career-smoke"
      - name: Probe College Scorecard bulk CDN transport
        if: contains(github.event.head_commit.message, '[live-scorecard-smoke]')
        continue-on-error: true
        run: python scripts/college_career_ingest.py --source college_scorecard --output-dir "${{ runner.temp }}/college-career-smoke"
      - name: Live integrated model-ready layer
        if: contains(github.event.head_commit.message, '[live-model-ready-smoke]')
        run: |
          python scripts/college_career_ingest.py --source ipeds_directory_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source ipeds_completions_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source cip_soc_crosswalk_2020_2018 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source onet_31_0 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source bls_employment_projections_2025_2035 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source bls_oews_may_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source dapip_accreditation --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --build-model-ready --enforce-coverage-baseline --output-dir "${{ runner.temp }}/college-career-smoke"
      - name: Live DAPIP accreditation and community-college coverage
        if: contains(github.event.head_commit.message, '[live-dapip-smoke]')
        run: |
          python scripts/college_career_ingest.py --source ipeds_directory_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source dapip_accreditation --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --build-institution-coverage --enforce-coverage-baseline --output-dir "${{ runner.temp }}/college-career-smoke"

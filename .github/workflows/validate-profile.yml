name: Validate portfolio resources

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "resources/**/*.xlsx"
      - "resources/**/*.docx"
      - "scripts/check_local_markdown_links.py"
      - "scripts/validate_office_resources.py"
      - "scripts/check_name_consistency.py"
      - "scripts/validate_college_career_sources.py"
      - "scripts/college_career_ingest.py"
      - "scripts/test_college_career_ingestion.py"
      - "projects/college-career-matching/**"
      - ".github/workflows/validate-profile.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "resources/**/*.xlsx"
      - "resources/**/*.docx"
      - "scripts/check_local_markdown_links.py"
      - "scripts/validate_office_resources.py"
      - "scripts/check_name_consistency.py"
      - "scripts/validate_college_career_sources.py"
      - "scripts/college_career_ingest.py"
      - "scripts/test_college_career_ingestion.py"
      - "projects/college-career-matching/**"
      - ".github/workflows/validate-profile.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate local Markdown links
        run: python scripts/check_local_markdown_links.py

      - name: Validate Office resource packages
        run: python scripts/validate_office_resources.py

      - name: Enforce full public name
        run: python scripts/check_name_consistency.py

      - name: Validate college career source contract
        run: python scripts/validate_college_career_sources.py

      - name: Test college career ingestion prototype
        run: python scripts/test_college_career_ingestion.py

      - name: Live CIP-SOC ingestion smoke test
        if: contains(github.event.head_commit.message, '[live-source-smoke]')
        run: python scripts/college_career_ingest.py --source cip_soc_crosswalk_2020_2018 --output-dir "${{ runner.temp }}/college-career-smoke"

      - name: Live IPEDS ingestion smoke test
        if: contains(github.event.head_commit.message, '[live-ipeds-smoke]')
        run: |
          python scripts/college_career_ingest.py --source ipeds_directory_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source ipeds_completions_2025 --output-dir "${{ runner.temp }}/college-career-smoke"

      - name: Live O*NET ingestion smoke test
        if: contains(github.event.head_commit.message, '[live-onet-smoke]')
        run: python scripts/college_career_ingest.py --source onet_31_0 --output-dir "${{ runner.temp }}/college-career-smoke"

      - name: Live BLS ingestion and O*NET coverage joins
        if: contains(github.event.head_commit.message, '[live-bls-smoke]')
        run: |
          python scripts/college_career_ingest.py --source onet_31_0 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source bls_employment_projections_2025_2035 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source bls_oews_may_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --build-career-joins --output-dir "${{ runner.temp }}/college-career-smoke"

      - name: Live DAPIP accreditation and community-college coverage
        if: contains(github.event.head_commit.message, '[live-dapip-smoke]')
        run: |
          python scripts/college_career_ingest.py --source ipeds_directory_2025 --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --source dapip_accreditation --output-dir "${{ runner.temp }}/college-career-smoke"
          python scripts/college_career_ingest.py --build-institution-coverage --output-dir "${{ runner.temp }}/college-career-smoke"




      - name: Inspect OEWS query app endpoints
        if: contains(github.event.head_commit.message, '[oes-query-smoke]')
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          ua = "LauraElizabethHand-CollegeCareerMatcher/0.3 (https://github.com/hand-lauraelizabeth/hand-lauraelizabeth)"
          url = "https://data.bls.gov/oes/"
          req = urllib.request.Request(url, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=60) as r:
              html = r.read().decode("utf-8", errors="replace")
              print("PAGE", r.status, r.geturl(), len(html))
          scripts = re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)', html, flags=re.I)
          print("SCRIPTS", scripts)
          for src in scripts[-8:]:
              full = urllib.parse.urljoin(url, src)
              print("\n### SCRIPT", full)
              try:
                  req = urllib.request.Request(full, headers={"User-Agent": ua})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      js = r.read().decode("utf-8", errors="replace")
                  print("BYTES", len(js))
                  for pat in [r'["\\\']([^"\\\']*api[^"\\\']*)["\\\']', r'["\\\']([^"\\\']*occupation[^"\\\']*)["\\\']', r'["\\\']([^"\\\']*datatype[^"\\\']*)["\\\']']:
                      vals = sorted(set(re.findall(pat, js, flags=re.I)))
                      for v in vals[:80]:
                          print("MATCH", v[:500])
              except Exception as e:
                  print("SCRIPT_ERROR", type(e).__name__, e)
          PY

name: Role Evidence Studio validation
on:
  push:
    branches: [main, 'review/role-evidence-*']
    paths:
      - 'projects/reverse-ats-role-evidence-engine/**'
      - '.github/workflows/role-evidence-validation.yml'
  pull_request:
    paths:
      - 'projects/reverse-ats-role-evidence-engine/**'
      - '.github/workflows/role-evidence-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Preserve duration interpretation and required versus preferred context
        run: |
          node projects/reverse-ats-role-evidence-engine/tests/chronology.test.mjs
          node projects/reverse-ats-role-evidence-engine/tests/requirements.test.mjs
  browser-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install matching browser driver and document readers
        run: python -m pip install playwright==1.57.0 lxml pypdf
      - name: Rebuild the exact production workspace and embed
        run: |
          python projects/reverse-ats-role-evidence-engine/interface/build.py
          python projects/reverse-ats-role-evidence-engine/package-wordpress.py
      - name: Verify usable journeys and preserved functions in three browsers
        run: python projects/reverse-ats-role-evidence-engine/tests/usability.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reverse-ats-usability
          path: projects/reverse-ats-role-evidence-engine/usability-*.png

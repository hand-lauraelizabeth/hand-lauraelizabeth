name: FT-01 UTF-8 input byte boundary
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  input-byte-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parser byte limit with synthetic Unicode and BOM fixtures
        run: node projects/data-rescue-studio/tests/input-utf8-byte-budget.test.cjs

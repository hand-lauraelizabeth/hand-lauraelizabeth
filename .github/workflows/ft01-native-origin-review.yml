name: FT-01 native origin browser review
on:
  push:
    branches:
      - 'review/ft01-native-insecure-origin-*'
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-native-origin-review.yml'
  pull_request:
    paths:
      - 'projects/data-rescue-studio/**'
      - '.github/workflows/ft01-native-origin-review.yml'
permissions:
  contents: read
jobs:
  native-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          cd projects/data-rescue-studio
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Validate test syntax
        run: node --check projects/data-rescue-studio/tests/native-origin-browser.test.cjs
      - name: Verify native browser trust boundary and local evidence export
        run: node projects/data-rescue-studio/tests/native-origin-browser.test.cjs

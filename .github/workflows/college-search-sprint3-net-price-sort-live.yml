name: College Search net-price sort live WordPress browser regression
on:
  push:
    branches:
      - feature/college-search-sprint1-20261009
    paths:
      - '.github/workflows/college-search-sprint3-net-price-sort-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-sort:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate unchanged v3 source and full 6243-row price sort
        run: |
          python projects/college-career-matching/build_sprint3_cost_city.py --check
          node projects/college-career-matching/tests/test_sprint3_net_sort.cjs
      - name: Install Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify ACTUAL published WordPress sort at mobile and desktop width
        run: python projects/college-career-matching/tests/test_sprint3_net_sort_browser.py --live

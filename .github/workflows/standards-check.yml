name: Standards Check browser-local regression
on:
  pull_request:
    paths:
      - "projects/standards-check/**"
      - ".github/workflows/standards-check.yml"
  push:
    branches: [main]
    paths:
      - "projects/standards-check/**"
      - ".github/workflows/standards-check.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run Standards Check regression tests
        run: node projects/standards-check/test.cjs

name: FT-01 CSV export table shape
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  csv-shape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject inconsistent CSV tables and verify synthetic round trips
        run: node projects/data-rescue-studio/tests/export-table-shape.test.cjs

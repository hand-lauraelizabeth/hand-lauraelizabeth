name: Data Rescue Studio checks

on:
  push:
    branches:
      - review/free-tools-data-rescue-20261013
    paths:
      - "projects/data-rescue-studio/**"
      - ".github/workflows/data-rescue-validation.yml"
  pull_request:
    paths:
      - "projects/data-rescue-studio/**"
      - ".github/workflows/data-rescue-validation.yml"

permissions:
  contents: read

jobs:
  test-data-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run local CSV/TSV regression suite
        run: node projects/data-rescue-studio/tests/rescue-core.test.js
